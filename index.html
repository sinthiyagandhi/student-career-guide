<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Career Guide</title>

    <meta name="description"
          content="Student Career Guide helps students explore career paths, discover skills, find learning resources and plan their careers.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        :root {
            --primary: #4f46e5;
            --secondary: #7c3aed;
            --light: #f5f7ff;
            --dark: #1f2937;
            --text: #374151;
            --white: #ffffff;
            --border: #e5e7eb;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--light);
            color: var(--text);
            line-height: 1.6;
        }

        /* NAVIGATION */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
            padding: 15px 20px;
        }

        .nav-container {
            max-width: 1150px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-weight: bold;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .menu-btn {
            display: none;
            font-size: 25px;
            border: none;
            background: none;
            cursor: pointer;
        }

        /* HERO */

        .hero {
            min-height: 620px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 70px 20px;
            color: white;
            background: linear-gradient(
                135deg,
                #4338ca,
                #6366f1,
                #7c3aed
            );
        }

        .hero-content {
            max-width: 850px;
        }

        .hero h1 {
            font-size: 56px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 21px;
            margin-bottom: 30px;
            opacity: 0.95;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
        }

        .btn-primary {
            background: white;
            color: var(--primary);
        }

        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid white;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        /* GENERAL */

        section {
            padding: 75px 20px;
        }

        .container {
            max-width: 1150px;
            margin: auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 15px;
            color: var(--primary);
            font-size: 36px;
        }

        .section-subtitle {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 40px;
            color: #6b7280;
        }

        /* ABOUT */

        .about-box {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
            text-align: center;
        }

        .about-box p {
            font-size: 18px;
        }

        /* CAREER SEARCH */

        .search-box {
            max-width: 650px;
            margin: 0 auto 35px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 17px 22px;
            border: 2px solid var(--border);
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        /* CAREER CARDS */

        .career-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
            gap: 25px;
        }

        .career-card {
            background: white;
            padding: 30px 25px;
            border-radius: 18px;
            box-shadow: 0 7px 25px rgba(0,0,0,0.07);
            transition: 0.3s;
            text-align: center;
            border: 1px solid transparent;
        }

        .career-card:hover {
            transform: translateY(-8px);
            border-color: #c7d2fe;
            box-shadow: 0 12px 30px rgba(79,70,229,0.15);
        }

        .career-icon {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .career-card h3 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 20px;
        }

        .career-card p {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 18px;
        }

        .learn-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .learn-btn:hover {
            background: var(--secondary);
        }

        .no-results {
            text-align: center;
            display: none;
            padding: 25px;
            color: #6b7280;
        }

        /* SKILLS */

        .skills-section {
            background: #eef0ff;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .skill-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
        }

        .skill-card span {
            font-size: 35px;
        }

        .skill-card h3 {
            margin: 10px 0;
            color: var(--primary);
        }

        /* ROADMAP */

        .roadmap {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-top: 40px;
        }

        .roadmap-step {
            background: white;
            padding: 25px 15px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
            position: relative;
        }

        .step-number {
            width: 45px;
            height: 45px;
            margin: auto;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .roadmap-step h3 {
            margin: 15px 0 8px;
            color: var(--primary);
        }

        /* RESOURCES */

        .resources {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .resource-card {
            background: white;
            padding: 28px;
            border-radius: 17px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }

        .resource-card h3 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .resource-card a {
            display: inline-block;
            margin-top: 15px;
            color: var(--primary);
            font-weight: bold;
            text-decoration: none;
        }

        /* QUIZ */

        .quiz-box {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .question {
            margin-bottom: 28px;
        }

        .question h3 {
            margin-bottom: 15px;
            color: var(--dark);
        }

        .option {
            display: block;
            background: #f5f7ff;
            padding: 12px 15px;
            margin: 8px
