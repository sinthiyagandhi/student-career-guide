<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Career Guide</title>

    <meta name="description"
          content="Student Career Guide helps students explore career paths, discover skills, find learning resources and plan their careers.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        :root {
            --primary: #4f46e5;
            --secondary: #7c3aed;
            --light: #f5f7ff;
            --dark: #1f2937;
            --text: #374151;
            --white: #ffffff;
            --border: #e5e7eb;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--light);
            color: var(--text);
            line-height: 1.6;
        }

        /* NAVIGATION */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
            padding: 15px 20px;
        }

        .nav-container {
            max-width: 1150px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-weight: bold;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .menu-btn {
            display: none;
            font-size: 25px;
            border: none;
            background: none;
            cursor: pointer;
        }

        /* HERO */

        .hero {
            min-height: 620px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 70px 20px;
            color: white;
            background: linear-gradient(
                135deg,
                #4338ca,
                #6366f1,
                #7c3aed
            );
        }

        .hero-content {
            max-width: 850px;
        }

        .hero h1 {
            font-size: 56px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 21px;
            margin-bottom: 30px;
            opacity: 0.95;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
        }

        .btn-primary {
            background: white;
            color: var(--primary);
        }

        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid white;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        /* GENERAL */

        section {
            padding: 75px 20px;
        }

        .container {
            max-width: 1150px;
            margin: auto;
        }
